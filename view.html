<!DOCTYPE html>
<html lang="en" class="view">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClubTrack Live</title>
<link rel="icon" href="Logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="landing">
<div class="view-wrap">
  <div class="view-top">
    <a class="view-brand" href="index.html">⛳ ClubTrack</a>
    <div class="view-intro">Follow a live round</div>
    <form class="view-form" id="codeForm">
      <input class="lobby-custom-input" id="codeInput" placeholder="XXX-XXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="7">
      <button class="share-btn" type="submit">Show</button>
    </form>
    <div class="view-status" id="viewStatus"></div>
    <div class="view-intro-hint">The code is under Round Summary → Live Share on the phone</div>
  </div>
  <div id="viewRound"></div>
</div>

<script src="share.js"></script>
<script src="view.js"></script>
</body>
</html>
